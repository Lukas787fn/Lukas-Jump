<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lukas Jump</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#10152e;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh;background:linear-gradient(#11183b,#30265c 62%,#17182e)}#ui{position:fixed;inset:0;color:#fff;pointer-events:none}.hud{position:absolute;inset:0 0 auto;height:64px;padding:12px;font-weight:900;text-shadow:0 2px 4px #000;display:flex;justify-content:space-between}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:20px}.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#090d24b8;pointer-events:auto}.card{width:min(350px,90vw);padding:28px 22px;text-align:center;border:2px solid #ffffff33;border-radius:28px;background:#171a3eee;box-shadow:0 20px 60px #0009}.logo{font-size:56px;line-height:.85;font-weight:1000;text-shadow:0 5px #22194d;margin-bottom:24px}.logo span{font-size:44px;color:#c8b7ff}button{border:0;border-radius:15px;color:#fff;font-size:16px;font-weight:900;padding:14px;width:100%;margin:7px 0;background:#ffffff18}.primary{background:#7b4dff;box-shadow:0 8px 20px #0005}.controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.controls div{display:flex;gap:12px}.controls button{width:68px;height:68px;margin:0;padding:0;font-size:28px;background:#ffffff22;border:2px solid #ffffff55;pointer-events:auto}.controls #jump{width:82px}.hidden{display:none}.pause{position:absolute;right:12px;top:8px;width:46px;padding:8px;font-size:20px;pointer-events:auto}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="ui"><div class="hud"><span>🪙 <b id="coins">0</b>　❤️ <b id="lives">3</b></span><span class="title">LUKAS JUMP</span></div><button class="pause" id="pause">Ⅱ</button><div id="menu" class="panel"><div class="card"><div class="logo">LUKAS<br><span>JUMP</span></div><button class="primary" id="play">▶ SPIELEN</button><p>← → bewegen · Leertaste springen</p></div></div><div id="over" class="panel hidden"><div class="card"><div class="logo">GAME<br><span>OVER</span></div><p>Du hast <b id="final">0</b> Münzen gesammelt.</p><button class="primary" id="again">↻ NOCHMAL</button><button id="home">HAUPTMENÜ</button></div></div><div class="controls"><div><button id="left">←</button><button id="right">→</button></div><button id="jump">↑</button></div></div>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let W,H,dpr,raf,playing=false,paused=false,coins=0,lives=3,cam=0;const keys={left:false,right:false};
const player={x:100,y:300,w:38,h:56,vx:0,vy:0,ground:false};
const platforms=[[0,520,700,40],[780,450,420,40],[1280,540,420,40],[1780,430,450,40],[2320,510,460,40],[2880,420,450,40],[3420,520,520,40],[4040,450,500,40],[4650,520,650,40]];
const world=5300, enemyData=[[900,408,810,1160],[1400,498,1310,1650],[2450,468,2340,2730],[3550,478,3440,3890],[4750,478,4660,5200]];let enemies=[],items=[];
function resize(){W=innerWidth;H=innerHeight;dpr=devicePixelRatio||1;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){player.x=100;player.y=300;player.vx=player.vy=0;cam=0;coins=0;lives=3;items=[];platforms.forEach(p=>{for(let x=p[0]+70;x<p[0]+p[2]-25;x+=70)items.push({x,y:p[1]-34,got:false})});enemies=enemyData.map(e=>({x:e[0],y:e[1],min:e[2],max:e[3],v:1.3,w:34,h:42}));ui()}
function ui(){document.querySelector('#coins').textContent=coins;document.querySelector('#lives').textContent=lives}
function jump(){if(player.ground){player.vy=-13;player.ground=false}}
function bind(id,key){let b=document.querySelector(id),d=e=>{e.preventDefault();keys[key]=true},u=e=>{e.preventDefault();keys[key]=false};b.onpointerdown=d;b.onpointerup=u;b.onpointercancel=u;b.onpointerleave=u}bind('#left','left');bind('#right','right');document.querySelector('#jump').onpointerdown=e=>{e.preventDefault();jump()};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key===' '||e.key==='ArrowUp')jump()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
function box(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hurt(){lives--;ui();if(lives<=0){playing=false;document.querySelector('#final').textContent=coins;document.querySelector('#over').classList.remove('hidden')}else{player.x=Math.max(40,player.x-140);player.y=250;player.vy=-7}}
function update(){if(!playing||paused)return;player.vx+=(keys.right?0.65:0)-(keys.left?0.65:0);if(!keys.left&&!keys.right)player.vx*=.82;player.vx=Math.max(-6,Math.min(6,player.vx));player.vy+=.65;player.x+=player.vx;player.y+=player.vy;player.ground=false;for(const p of platforms){let b={x:p[0],y:p[1],w:p[2],h:p[3]};if(box(player,b)&&player.vy>=0&&player.y+player.h-player.vy<=p[1]+8){player.y=p[1]-player.h;player.vy=0;player.ground=true}}player.x=Math.max(0,Math.min(world-player.w,player.x));for(const q of items)if(!q.got&&Math.hypot(player.x+19-q.x,player.y+28-q.y)<30){q.got=true;coins++;ui()}for(const e of enemies){e.x+=e.v;if(e.x<e.min||e.x>e.max)e.v*=-1;if(box(player,e)){if(player.vy>1&&player.y+player.h<e.y+15){e.x=e.min;player.vy=-8}else hurt()}}if(player.y>H+100)hurt();cam+=(player.x-W*.35-cam)*.08;cam=Math.max(0,Math.min(world-W,cam))}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';for(let i=0;i<50;i++){ctx.globalAlpha=.3+(i%3)*.2;ctx.fillRect((i*97)%W,(i*53)%(H*.55),2,2)}ctx.globalAlpha=1;ctx.save();ctx.translate(-cam,0);for(let x=80;x<world;x+=260){ctx.fillStyle='#8c5b87';ctx.fillRect(x,380,12,95);ctx.fillStyle='#b43d65';ctx.beginPath();ctx.arc(x+6,375,48,Math.PI,0);ctx.fill()}for(const p of platforms){ctx.fillStyle='#8f78a5';ctx.fillRect(...p);ctx.fillStyle='#c7b5cf';ctx.fillRect(p[0],p[1],p[2],8)}for(const q of items)if(!q.got){ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(q.x,q.y,10,0,7);ctx.fill()}for(const e of enemies){ctx.fillStyle='#4b244f';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#ff5b7a';ctx.fillRect(e.x+6,e.y+8,7,7);ctx.fillRect(e.x+21,e.y+8,7,7)}ctx.fillStyle='#ffbf69';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='#241b45';ctx.fillRect(player.x+7,player.y+13,7,7);ctx.fillRect(player.x+24,player.y+13,7,7);ctx.fillStyle='#eee';ctx.fillRect(world-180,350,8,170);ctx.fillStyle='#ff4d69';ctx.beginPath();ctx.moveTo(world-172,350);ctx.lineTo(world-80,380);ctx.lineTo(world-172,410);ctx.fill();ctx.restore();ctx.fillStyle='#ffffff33';ctx.fillRect(70,H-105,W-140,7);ctx.fillStyle='#8e6cff';ctx.fillRect(70,H-105,(W-140)*Math.min(1,player.x/(world-200)),7)}
function loop(){if(!playing)return;update();draw();if(playing)raf=requestAnimationFrame(loop)}
function start(){reset();playing=true;paused=false;document.querySelector('#menu').classList.add('hidden');document.querySelector('#over').classList.add('hidden');cancelAnimationFrame(raf);loop()}
document.querySelector('#play').onclick=start;document.querySelector('#again').onclick=start;document.querySelector('#home').onclick=()=>{playing=false;document.querySelector('#over').classList.add('hidden');document.querySelector('#menu').classList.remove('hidden')};document.querySelector('#pause').onclick=()=>{if(playing){paused=!paused;if(!paused)loop()}};reset();draw();
</script></body></html>
