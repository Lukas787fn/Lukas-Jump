<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lukas Jump - Princess Adventure</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#10152e;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh;background:linear-gradient(#11183b,#30265c 62%,#17182e)}#ui{position:fixed;inset:0;color:#fff;pointer-events:none}.hud{position:absolute;inset:0 0 auto;height:64px;padding:12px;font-weight:900;text-shadow:0 2px 4px #000;display:flex;justify-content:space-between;align-items:center}.title{position:absolute;left:50%;transform:translateX(-50%);font-size:20px}.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#090d24b8;pointer-events:auto;flex-direction:column}.card{width:min(380px,90vw);padding:28px 22px;text-align:center;border:2px solid #ffffff33;border-radius:28px;background:#171a3eee;box-shadow:0 20px 60px #0009}.logo{font-size:56px;line-height:.85;font-weight:1000;text-shadow:0 5px #22194d;margin-bottom:24px}.logo span{font-size:44px;color:#c8b7ff}button{border:0;border-radius:15px;color:#fff;font-size:16px;font-weight:900;padding:14px;width:100%;margin:7px 0;background:#ffffff18}.primary{background:#7b4dff;box-shadow:0 8px 20px #0005}.controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.controls div{display:flex;gap:12px}.controls button{width:68px;height:68px;margin:0;padding:0;font-size:28px;background:#ffffff22;border:2px solid #ffffff55;pointer-events:auto}.controls #jump{width:82px}.hidden{display:none}.pause{position:absolute;right:12px;top:8px;width:46px;padding:8px;font-size:20px;pointer-events:auto}.level-info{position:absolute;top:80px;left:50%;transform:translateX(-50%);font-size:14px;background:#ffffff11;padding:8px 16px;border-radius:10px;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="ui"><div class="hud"><span>🪙 <b id="coins">0</b>　❤️ <b id="lives">5</b>　⚡<b id="power">0</b></span><span class="title">LUKAS JUMP</span><span id="level-badge">Level 1</span></div><div id="level-info" class="level-info"></div><button class="pause" id="pause">🔊</button><div id="menu" class="panel"><div class="card"><div class="logo">👸<br><span>PRINCESS JUMP</span></div><p>Hilf der Prinzessin, den Turm zu verlassen!</p><button class="primary" id="play">▶ SPIELEN</button><p style="font-size:12px;margin-top:14px">← → bewegen · Leertaste springen · Power-Ups sammeln!</p></div></div><div id="over" class="panel hidden"><div class="card"><div class="logo">💔</div><p>Du hast <b id="final">0</b> Münzen gesammelt.</p><p id="msg"></p><button class="primary" id="again">↻ NOCHMAL</button><button id="home">HAUPTMENÜ</button></div></div><div id="won" class="panel hidden"><div class="card"><div class="logo">⭐</div><p>Level <b id="lvl"></b> abgeschlossen!</p><p><b id="score"></b> Punkte</p><button class="primary" id="next">➜ NÄCHSTES LEVEL</button></div></div><div class="controls"><div><button id="left">←</button><button id="right">→</button></div><button id="jump">↑</button></div></div>
<script>
// Audio synthesis
class AudioSynth{constructor(){this.ac=new(window.AudioContext||window.webkitAudioContext)()}play(type,freq,dur,vol=.3){const osc=this.ac.createOscillator(),gain=this.ac.createGain();osc.type=type;osc.frequency.value=freq;gain.gain.setValueAtTime(vol,this.ac.currentTime);gain.gain.exponentialRampToValueAtTime(.01,this.ac.currentTime+dur);osc.connect(gain);gain.connect(this.ac.destination);osc.start();osc.stop(this.ac.currentTime+dur)}}const synth=new AudioSynth();
function sfx(name){switch(name){case'jump':synth.play('sine',440,.15,.2);break;case'coin':synth.play('sine',800,.1,.15);synth.play('sine',1000,.1,.15);break;case'hit':synth.play('square',200,.3,.3);break;case'powerup':synth.play('sine',600,.2,.2);synth.play('sine',800,.2,.2);break;case'boss':synth.play('square',150,.5,.4);synth.play('sine',220,.5,.3);break;case'levelup':synth.play('sine',880,.3,.3);synth.play('sine',1000,.3,.3);synth.play('sine',1100,.3,.3)}}
let bgm=null;function playBGM(){if(bgm)return;bgm=setInterval(()=>{synth.play('sine',220,.4,.05);synth.play('sine',329,.4,.05)},600)}
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
let W,H,dpr,raf,playing=false,paused=false,coins=0,lives=5,cam=0,level=1,powerups={shield:0,speed:0,jump:0},boss=null;
const keys={left:false,right:false};
const player={x:100,y:300,w:32,h:48,vx:0,vy:0,ground:false,shielded:false};

const LEVELS=[
{platforms:[[0,520,700,40],[780,450,420,40],[1280,540,420,40],[1780,430,450,40],[2320,510,460,40],[2880,420,450,40],[3420,520,520,40],[4040,450,500,40],[4650,520,650,40]],enemies:[[900,408,810,1160],[1400,498,1310,1650],[2450,468,2340,2730],[3550,478,3440,3890],[4750,478,4660,5200]],items:null,world:5300,title:'Level 1: Der Turm'},
{platforms:[[0,520,900,40],[950,420,350,40],[1380,500,380,40],[1850,380,400,40],[2330,470,420,40],[2850,350,450,40],[3380,480,520,40],[3990,380,550,40],[4620,500,750,40]],enemies:[[700,468,600,1200],[1500,368,1350,1800],[2600,418,2450,3100],[3700,328,3550,4200],[4800,448,4650,5350]],items:null,world:5650,title:'Level 2: Der dunkle Korridor'},
{platforms:[[0,500,800,40],[850,380,350,40],[1250,480,370,40],[1700,320,400,40],[2170,450,420,40],[2650,300,450,40],[3150,420,500,40],[3700,280,550,40],[4320,400,600,40],[4980,200,700,40]],enemies:[[600,448,500,1100],[1400,328,1250,1700],[2400,398,2200,2900],[3500,228,3350,4200]],items:null,world:5700,title:'Level 3: Steintreppe',boss:{x:5300,y:200,w:50,h:60,hp:5,maxhp:5}},
{platforms:[[0,520,950,40],[980,400,380,40],[1450,480,400,40],[1940,350,420,40],[2430,460,430,40],[2950,300,460,40],[3500,420,500,40],[4080,280,550,40],[4710,400,680,40]],enemies:[[700,468,600,1300],[1600,348,1400,2000],[2700,408,2500,3200],[3800,228,3600,4500],[4900,368,4700,5400]],items:null,world:5800,title:'Level 4: Die Pforte'},
{platforms:[[0,520,1000,40],[1050,380,380,40],[1500,460,420,40],[2010,300,450,40],[2540,440,480,40],[3100,260,500,40],[3680,400,550,40],[4310,220,600,40],[5000,380,800,40]],enemies:[[800,468,650,1400],[1700,328,1450,2100],[2900,388,2700,3400],[4100,168,3900,4800]],items:null,world:6000,title:'Level 5: Der endlose Aufstieg',boss:{x:5900,y:150,w:50,h:60,hp:8,maxhp:8}}
];

let currentLevel=LEVELS[level-1],platforms=currentLevel.platforms,enemies=[],items=[],world=currentLevel.world;

function drawPlayer(x,y){const sx=x-cam;ctx.save();ctx.translate(sx+16,y+24);ctx.fillStyle='#ffe6d5';ctx.beginPath();ctx.arc(0,-20,10,0,7);ctx.fill();ctx.fillStyle='#ffc0cb';ctx.fillRect(-8,-28,16,8);ctx.fillStyle='#ffe6d5';ctx.fillRect(-12,-4,24,18);ctx.fillStyle='#fff';ctx.fillRect(-12,-4,24,10);ctx.fillStyle='#ff69b4';ctx.fillRect(-6,6,12,8);if(player.shielded){ctx.strokeStyle='#00ffff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.stroke()}ctx.restore()}

function drawBoss(b){const sx=b.x-cam;ctx.fillStyle='#8b0000';ctx.fillRect(sx,b.y,b.w,b.h);ctx.fillStyle='#ff6b6b';ctx.fillRect(sx+8,b.y+10,10,10);ctx.fillRect(sx+32,b.y+10,10,10);ctx.fillStyle='#000';ctx.fillRect(sx+10,b.y+12,6,6);ctx.fillRect(sx+34,b.y+12,6,6);for(let i=0;i<b.hp;i++){ctx.fillStyle='#00ff00';ctx.fillRect(sx+5+i*5,b.y-10,4,4)}}

function resetLevel(){player.x=100;player.y=300;player.vx=player.vy=0;cam=0;coins=0;powerups={shield:0,speed:0,jump:0};player.shielded=false;items=[];currentLevel.platforms.forEach(p=>{for(let x=p[0]+70;x<p[0]+p[2]-25;x+=70)items.push({x,y:p[1]-34,got:false,type:Math.random()<.15?['shield','speed','jump'][Math.floor(Math.random()*3)]:'coin'})});enemies=currentLevel.enemies.map(e=>({x:e[0],y:e[1],min:e[2],max:e[3],v:1.3,w:34,h:42}));boss=currentLevel.boss?{...currentLevel.boss}:null}

function ui(){document.querySelector('#coins').textContent=coins;document.querySelector('#lives').textContent=lives;document.querySelector('#power').textContent=Object.values(powerups).reduce((a,b)=>a+b)}

function jump(){if(player.ground){player.vy=-13-(powerups.jump*2);player.ground=false;sfx('jump')}}

function bind(id,key){let b=document.querySelector(id),d=e=>{e.preventDefault();keys[key]=true},u=e=>{e.preventDefault();keys[key]=false};b.onpointerdown=d;b.onpointerup=u;b.onpointercancel=u;b.onpointerleave=u}
bind('#left','left');bind('#right','right');
document.querySelector('#jump').onpointerdown=e=>{e.preventDefault();jump()};
document.querySelector('#pause').onpointerdown=()=>{if(playing){paused=!paused;if(!paused)loop()}};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;if(e.key===' '||e.key==='ArrowUp')jump()});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});

function box(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function hurt(){if(player.shielded){player.shielded=false;powerups.shield--;sfx('powerup');return}lives--;ui();if(lives<=0){playing=false;document.querySelector('#final').textContent=coins;document.querySelector('#msg').textContent='Versuche es noch mal!';document.querySelector('#over').classList.remove('hidden');sfx('hit')}else{player.x=Math.max(40,player.x-140);player.y=250;player.vy=-7;sfx('hit')}}

function update(){if(!playing||paused)return;const spd=1+powerups.speed*.3;player.vx+=(keys.right?0.65*spd:0)-(keys.left?0.65*spd:0);if(!keys.left&&!keys.right)player.vx*=.82;player.vx=Math.max(-6,Math.min(6,player.vx));player.vy+=.65;player.x+=player.vx;player.y+=player.vy;player.ground=false;
for(const p of platforms){let b={x:p[0],y:p[1],w:p[2],h:p[3]};if(box(player,b)&&player.vy>=0&&player.y+player.h-player.vy<=p[1]+8){player.y=p[1]-player.h;player.vy=0;player.ground=true}}
player.x=Math.max(0,Math.min(world-player.w,player.x));
for(const q of items)if(!q.got&&Math.hypot(player.x+16-q.x,player.y+24-q.y)<28){q.got=true;if(q.type==='coin'){coins++;sfx('coin')}else{powerups[q.type]++;sfx('powerup');if(q.type==='shield')player.shielded=true}ui()}
for(const e of enemies){e.x+=e.v;if(e.x<e.min||e.x>e.max)e.v*=-1;if(box(player,e)){if(player.vy>1&&player.y+player.h<e.y+15){e.x=e.min;player.vy=-8;sfx('jump');coins++}else hurt()}}
if(boss){boss.x+=boss.v||1;if(boss.x<boss.min||boss.x>boss.max)boss.v*=-1;if(box(player,boss)){if(player.vy>1&&player.y+player.h<boss.y+15){boss.hp--;player.vy=-10;sfx('boss');if(boss.hp<=0){coins+=50;playing=false;document.querySelector('#lvl').textContent=level;document.querySelector('#score').textContent=coins;document.querySelector('#won').classList.remove('hidden');sfx('levelup')}return}else hurt()}}
if(player.y>H+100){hurt()}
cam+=(player.x-W*.35-cam)*.08;cam=Math.max(0,Math.min(world-W,cam));
if(player.x>world-100&&!boss){coins+=30;playing=false;document.querySelector('#lvl').textContent=level;document.querySelector('#score').textContent=coins;document.querySelector('#won').classList.remove('hidden');sfx('levelup')}}

function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';for(let i=0;i<50;i++){ctx.globalAlpha=.3+(i%3)*.2;ctx.fillRect((i*97+Math.sin(Date.now()/1000+i)*)%W,(i*53)%(H*.55),2,2)}ctx.globalAlpha=1;
ctx.save();ctx.translate(-cam,0);
for(let x=80;x<world;x+=260){ctx.fillStyle='#8c5b87';ctx.fillRect(x,380,12,95);ctx.fillStyle='#b43d65';ctx.beginPath();ctx.arc(x+6,375,48,Math.PI,0);ctx.fill()}
for(const p of platforms){ctx.fillStyle='#8f78a5';ctx.fillRect(...p);ctx.fillStyle='#c7b5cf';ctx.fillRect(p[0],p[1],p[2],8)}
for(const q of items)if(!q.got){if(q.type==='coin'){ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.arc(q.x,q.y,8,0,7);ctx.fill()}else if(q.type==='shield'){ctx.fillStyle='#00ffff';ctx.beginPath();ctx.arc(q.x,q.y,10,0,7);ctx.stroke();ctx.strokeStyle='#00ffff';ctx.lineWidth=2}else if(q.type==='speed'){ctx.fillStyle='#ff6b6b';ctx.fillRect(q.x-8,q.y-4,16,8)}else if(q.type==='jump'){ctx.fillStyle='#ffff00';ctx.fillRect(q.x-6,q.y-6,12,12)}}
for(const e of enemies){ctx.fillStyle='#4b244f';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#ff5b7a';ctx.fillRect(e.x+6,e.y+8,7,7);ctx.fillRect(e.x+21,e.y+8,7,7)}
if(boss)drawBoss(boss);
drawPlayer(player.x,player.y);
ctx.fillStyle='#ffe6d5';ctx.fillRect(world-150,320,8,200);ctx.fillStyle='#ff1493';ctx.beginPath();ctx.moveTo(world-142,320);ctx.lineTo(world-50,350);ctx.lineTo(world-142,380);ctx.fill();
ctx.restore();
ctx.fillStyle='#ffffff33';ctx.fillRect(70,H-105,W-140,7);ctx.fillStyle='#8e6cff';ctx.fillRect(70,H-105,(W-140)*Math.min(1,player.x/(world-200)),7)}

function loop(){if(!playing)return;update();draw();if(playing)raf=requestAnimationFrame(loop)}

function start(){level=1;coins=0;lives=5;playBGM();nextLevel()}
function nextLevel(){if(level>LEVELS.length){document.querySelector('#menu').classList.remove('hidden');return}currentLevel=LEVELS[level-1];platforms=currentLevel.platforms;world=currentLevel.world;document.querySelector('#level-badge').textContent='Level '+level;document.querySelector('#level-info').textContent=currentLevel.title;document.querySelector('#level-info').style.display='block';setTimeout(()=>{document.querySelector('#level-info').style.display='none'},3000);resetLevel();playing=true;paused=false;document.querySelector('#menu').classList.add('hidden');document.querySelector('#over').classList.add('hidden');document.querySelector('#won').classList.add('hidden');cancelAnimationFrame(raf);loop()}

document.querySelector('#play').onclick=start;
document.querySelector('#again').onclick=()=>{level--;nextLevel()};
document.querySelector('#next').onclick=()=>{level++;nextLevel()};
document.querySelector('#home').onclick=()=>{playing=false;cancelAnimationFrame(raf);document.querySelector('#over').classList.add('hidden');document.querySelector('#won').classList.add('hidden');document.querySelector('#menu').classList.remove('hidden')};

function resize(){W=innerWidth;H=innerHeight;dpr=devicePixelRatio||1;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
resetLevel();draw();</script></body></html>
