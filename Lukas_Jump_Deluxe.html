<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Lukas Jump</title><style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#10152e;font-family:system-ui;color:white;touch-action:none}canvas{width:100vw;height:100vh;display:block;background:linear-gradient(#11183b,#39255b 65%,#17182e)}#hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;text-shadow:0 2px 4px #000;z-index:2}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#090d24cc;z-index:5}.card{width:min(360px,90vw);padding:28px 22px;text-align:center;border:2px solid #ffffff44;border-radius:25px;background:#171a3eee;box-shadow:0 20px 60px #0009}.logo{font-size:48px;font-weight:1000;line-height:.9;margin-bottom:25px}.logo span{color:#ffd6e7;font-size:30px}button{width:100%;margin:7px 0;padding:14px;border:0;border-radius:14px;color:#fff;background:#ffffff1c;font-size:16px;font-weight:900}.primary{background:#8a5cff}.controls{position:fixed;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;z-index:3;pointer-events:none}.controls div{display:flex;gap:12px}.controls button{pointer-events:auto;width:68px;height:68px;margin:0;padding:0;font-size:28px;background:#ffffff2b;border:2px solid #ffffff55}.controls #jump{width:84px}.hidden{display:none!important}.bossbar{position:fixed;top:42px;left:20%;right:20%;height:9px;background:#ffffff44;z-index:2}.bossbar i{display:block;height:100%;background:#ff4268;width:100%}
</style></head><body><canvas id="game"></canvas><div id="hud"><span>🪙 <b id="coins">0</b>　❤️ <b id="lives">5</b>　⚡ <b id="powers">0</b></span><b id="level">LEVEL 1</b></div><div id="bossbar" class="bossbar hidden"><i id="hp"></i></div><div id="menu" class="screen"><div class="card"><div class="logo">👸<br><span>LUKAS JUMP</span></div><p>Die Prinzessin im weißen Kleid muss den Turm retten!</p><button class="primary" id="start">▶ SPIELEN</button><small>← → bewegen · Leertaste / ↑ springen</small></div></div><div id="end" class="screen hidden"><div class="card"><div class="logo">⭐<br><span id="endText">GESCHAFFT!</span></div><button class="primary" id="next">NÄCHSTES LEVEL</button><button id="home">MENÜ</button></div></div><div class="controls"><div><button id="left">←</button><button id="right">→</button></div><button id="jump">↑</button></div><script>
'use strict';
const c=document.querySelector('canvas'),x=c.getContext('2d'),coinEl=document.querySelector('#coins'),lifeEl=document.querySelector('#lives'),powerEl=document.querySelector('#powers');let W,H,playing=false,level=1,coins=0,lives=5,cam=0,raf,keys={l:false,r:false},boss=null,power={shield:0,speed:0,jump:0};
const levels=[
{world:3600,platforms:[[0,520,650,40],[760,440,420,40],[1290,530,430,40],[1820,400,430,40],[2350,500,470,40],[2920,390,680,40]],boss:false},
{world:4300,platforms:[[0,520,700,40],[800,400,340,40],[1240,500,360,40],[1690,350,380,40],[2150,460,420,40],[2660,300,430,40],[3180,430,1000,40]],boss:false},
{world:4900,platforms:[[0,520,700,40],[780,370,330,40],[1200,470,380,40],[1650,300,400,40],[2130,430,420,40],[2620,250,430,40],[3150,390,430,40],[3680,300,1200,40]],boss:true}
];let L,platforms,items,enemies,player;
function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function tone(f=440,d=.12){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function setup(){L=levels[level-1];platforms=L.platforms;player={x:80,y:350,w:34,h:58,vx:0,vy:0,on:false};cam=0;power={shield:0,speed:0,jump:0};items=[];platforms.forEach(p=>{for(let q=p[0]+70;q<p[0]+p[2]-30;q+=75)items.push({x:q,y:p[1]-30,got:false,type:Math.random()<.18?['shield','speed','jump'][Math.random()*3|0]:'coin'})});enemies=platforms.slice(1,-1).map((p,i)=>({x:p[0]+100,y:p[1]-40,w:32,h:40,min:p[0],max:p[0]+p[2]-32,v:1.2+i*.2}));boss=L.boss?{x:L.world-400,y:310,w:65,h:70,hp:8,max:8,v:1.5,min:L.world-650,maxX:L.world-80}:null;document.querySelector('#bossbar').classList.toggle('hidden',!boss);ui()}
function ui(){coinEl.textContent=coins;lifeEl.textContent=lives;powerEl.textContent=power.shield+power.speed+power.jump;if(boss)document.querySelector('#hp').style.width=100*boss.hp/boss.max+'%'}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function jump(){if(player.on){player.vy=-13-power.jump*2;player.on=false;tone(600)}}
function button(id,k){let b=document.querySelector(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>keys[k]=false))}button('#left','l');button('#right','r');document.querySelector('#jump').onpointerdown=jump;addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;if(e.key===' '||e.key==='ArrowUp')jump()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false});
function hurt(){if(power.shield){power.shield=0;ui();tone(900);return}if(--lives<=0){playing=false;document.querySelector('#endText').textContent='GAME OVER';document.querySelector('#next').textContent='NOCHMAL';document.querySelector('#end').classList.remove('hidden')}else{player.x=Math.max(0,player.x-150);player.y=220;player.vy=-8;tone(160)}ui()}
function update(){if(!playing)return;let speed=1+power.speed*.25;player.vx+=(keys.r?.65*speed:0)-(keys.l?.65*speed:0);if(!keys.l&&!keys.r)player.vx*=.82;player.vx=Math.max(-6,Math.min(6,player.vx));player.vy+=.65;player.x+=player.vx;player.y+=player.vy;player.on=false;for(let p of platforms){let b={x:p[0],y:p[1],w:p[2],h:p[3]};if(hit(player,b)&&player.vy>=0&&player.y+player.h-player.vy<=p[1]+8){player.y=p[1]-player.h;player.vy=0;player.on=true}}player.x=Math.max(0,Math.min(L.world-player.w,player.x));for(let q of items)if(!q.got&&Math.hypot(player.x+17-q.x,player.y+28-q.y)<30){q.got=true;if(q.type==='coin'){coins++;tone(900)}else power[q.type]++;ui()}for(let e of enemies){e.x+=e.v;if(e.x<e.min||e.x>e.max)e.v*=-1;if(hit(player,e)){if(player.vy>1&&player.y+player.h<e.y+16){player.vy=-9;coins++;tone(700)}else hurt()}}if(boss){boss.x+=boss.v;if(boss.x<boss.min||boss.x>boss.maxX)boss.v*=-1;if(hit(player,boss)){if(player.vy>1&&player.y+player.h<boss.y+18){boss.hp--;player.vy=-10;tone(250);ui();if(boss.hp<=0)finish()}else hurt()}}if(player.y>H+100)hurt();cam+=(player.x-W*.35-cam)*.08;cam=Math.max(0,Math.min(L.world-W,cam));if(!boss&&player.x>L.world-120)finish()}
function finish(){playing=false;coins+=30;document.querySelector('#endText').textContent='LEVEL '+level+' GESCHAFFT!';document.querySelector('#next').textContent=level<levels.length?'NÄCHSTES LEVEL':'NOCHMAL VON VORN';document.querySelector('#end').classList.remove('hidden');tone(1100,.3)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#fff';for(let i=0;i<45;i++){x.globalAlpha=.3;x.fillRect((i*97)%W,(i*53)%(H*.6),2,2)}x.globalAlpha=1;x.save();x.translate(-cam,0);for(let p of platforms){x.fillStyle='#8d76a5';x.fillRect(...p);x.fillStyle='#d5c2dc';x.fillRect(p[0],p[1],p[2],8)}for(let q of items)if(!q.got){x.fillStyle=q.type==='coin'?'#ffd83d':q.type==='shield'?'#00eaff':q.type==='speed'?'#ff526d':'#ffe600';x.beginPath();x.arc(q.x,q.y,q.type==='coin'?9:11,0,7);x.fill()}for(let e of enemies){x.fillStyle='#54234f';x.fillRect(e.x,e.y,e.w,e.h);x.fillStyle='#ff6885';x.fillRect(e.x+6,e.y+8,7,7);x.fillRect(e.x+20,e.y+8,7,7)}if(boss){x.fillStyle='#861d3c';x.fillRect(boss.x,boss.y,boss.w,boss.h);x.fillStyle='#ffea4f';x.fillRect(boss.x+12,boss.y+14,10,10);x.fillRect(boss.x+43,boss.y+14,10,10)}let px=player.x,py=player.y;x.fillStyle='#fff';x.beginPath();x.moveTo(px+17,py+15);x.lineTo(px-3,py+55);x.lineTo(px+37,py+55);x.closePath();x.fill();x.fillStyle='#ffe0cc';x.beginPath();x.arc(px+17,py+5,11,0,7);x.fill();x.fillStyle='#d889bd';x.fillRect(px+7,py-5,20,8);x.fillStyle='#333';x.fillRect(px+10,py+3,3,3);x.fillRect(px+22,py+3,3,3);if(power.shield){x.strokeStyle='#00eaff';x.lineWidth=3;x.beginPath();x.arc(px+17,py+25,30,0,7);x.stroke()}x.restore();x.fillStyle='#ffffff44';x.fillRect(70,H-105,W-140,7);x.fillStyle='#9b70ff';x.fillRect(70,H-105,(W-140)*player.x/(L.world-120),7)}function loop(){if(!playing)return;update();draw();raf=requestAnimationFrame(loop)}
function start(){level=1;coins=0;lives=5;setup();playing=true;document.querySelector('#menu').classList.add('hidden');loop()}document.querySelector('#start').onclick=start;document.querySelector('#next').onclick=()=>{if(document.querySelector('#next').textContent==='NOCHMAL')return start();level=level<levels.length?level+1:1;setup();playing=true;document.querySelector('#end').classList.add('hidden');loop()};document.querySelector('#home').onclick=()=>{playing=false;document.querySelector('#end').classList.add('hidden');document.querySelector('#menu').classList.remove('hidden')};setup();draw();
</script></body></html>
